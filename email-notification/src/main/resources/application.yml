spring:
  security:
    oauth2:
      resourceServer:
        jwt:
          issuer-uri: http://localhost:8080/realms/taskmanager
          jwk-set-uri: ${spring.security.oauth2.resourceServer.jwt.issuer-uri}/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:5432/emailmanager
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: localhost
    port: 8025        # SMTP na porta externa (localhost:8025)
    username: "igor"
    password: "12345678"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
server:
  port: 8084